[project]
name = "code-corpus"
version = "0.1.0"
description = "Build personal-code datasets and compare MLX LoRA adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.3,<5",
  "datasketch>=1.6.5,<2",
  "matplotlib>=3.9,<4",
  "pyyaml>=6.0.2,<7",
  "safetensors>=0.5,<1",
  "seaborn>=0.13.2,<0.14",
]

[project.optional-dependencies]
train = [
  "mlx-lm[train]>=0.31,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-vlm>=0.6.3,<0.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
deploy = [
  "sentencepiece>=0.2,<0.3",
  "torch>=2.8,<3",
  "transformers>=5,<6",
]

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["*.py", "tests"]
exclude = ["datasets", "repos", "runs", "stats", "report"]
useLibraryCodeForTypes = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
